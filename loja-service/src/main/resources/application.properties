spring.application.name=loja-service
server.port=8083

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/loja_service?useTimezone=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.url=jdbc:mysql://localhost:3307/?allowPublicKeyRetrieval=true&useSSL=false
spring.flyway.schemas=loja_service
spring.flyway.user=root
spring.flyway.password=admin123

spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.fail-on-empty-beans=false

# Endereco dos outros microsservicos (no Docker sao trocados por variaveis de ambiente)
url.personagens=http://localhost:8081
url.inventario=http://localhost:8082
